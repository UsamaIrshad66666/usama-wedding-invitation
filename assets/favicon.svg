<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1b4536"/>
      <stop offset="60%" stop-color="#0f2b21"/>
      <stop offset="100%" stop-color="#081813"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cd"/>
      <stop offset="35%" stop-color="#dfb86c"/>
      <stop offset="70%" stop-color="#b88d3b"/>
      <stop offset="100%" stop-color="#e8cf94"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Medallion -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Outer Filigree Ring -->
  <circle cx="64" cy="64" r="53" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 2" opacity="0.8"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.5"/>

  <!-- Four Ornamental Accents -->
  <path d="M 64 8 L 66 14 L 64 12 L 62 14 Z" fill="url(#goldGrad)"/>
  <path d="M 64 120 L 66 114 L 64 116 L 62 114 Z" fill="url(#goldGrad)"/>
  <path d="M 8 64 L 14 66 L 12 64 L 14 62 Z" fill="url(#goldGrad)"/>
  <path d="M 120 64 L 114 66 L 116 64 L 114 62 Z" fill="url(#goldGrad)"/>

  <!-- Monogram "UI" in Regal Serif -->
  <text x="64" y="74" text-anchor="middle" font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" font-weight="600" font-size="38" fill="url(#goldGrad)" letter-spacing="3" filter="url(#glow)">UI</text>
  
  <!-- Subtle Crescent/Crown dot at bottom -->
  <circle cx="64" cy="85" r="2" fill="url(#goldGrad)"/>
</svg>
