<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dawat Nama by Elitara — Invitation Studio (Admin)</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --emerald-dark: #081a13;
      --emerald-mid: #0d281e;
      --emerald-deep: #05130e;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-line: rgba(212, 173, 93, 0.35);
      --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f9e8a2 50%, #aa820a 100%);
      --cream: #fbf7ee;
      --cream-muted: #d9cfb8;
      --sans: "Montserrat", sans-serif;
      --serif: "Cinzel", serif;
      --urdu: "Noto Nastaliq Urdu", serif;
      --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--emerald-dark);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(26, 77, 58, 0.45) 0%, transparent 60%),
        radial-gradient(circle at 10% 85%, rgba(13, 40, 30, 0.5) 0%, transparent 50%),
        radial-gradient(circle at 90% 85%, rgba(13, 40, 30, 0.5) 0%, transparent 50%);
      color: var(--cream);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    .admin-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    .admin-header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--gold-line);
    }
    .admin-brand-title {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      color: var(--gold-light);
      letter-spacing: 0.06em;
      margin-bottom: 0.3rem;
    }
    .admin-brand-sub {
      color: var(--gold-primary);
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .admin-top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 1.2rem;
    }

    .admin-section {
      background: rgba(10, 31, 23, 0.82);
      border: 1px solid var(--gold-line);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .admin-section-header {
      font-family: var(--serif);
      font-size: 1.2rem;
      color: var(--gold-light);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px dashed rgba(212, 173, 93, 0.25);
      padding-bottom: 8px;
    }

    .admin-grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 12px;
    }

    .admin-field-label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--gold-primary);
      margin-bottom: 5px;
    }

    .admin-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      background: rgba(4, 15, 11, 0.9);
      border: 1px solid var(--gold-line);
      color: #fff;
      font-family: var(--sans);
      font-size: 0.92rem;
      outline: none;
      transition: var(--transition);
    }
    .admin-input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 10px rgba(212, 173, 93, 0.4);
    }
    .admin-input[dir="rtl"] {
      font-family: var(--urdu), var(--sans);
      text-align: right;
    }

    .admin-hosts-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    .admin-host-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr auto;
      gap: 8px;
      align-items: center;
      background: rgba(5, 18, 13, 0.65);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgba(212, 173, 93, 0.18);
    }
    @media (max-width: 680px) {
      .admin-host-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }

    .gold-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--gold-gradient);
      color: #0b2018;
      border: 1px solid #ffe89e;
      padding: 12px 24px;
      border-radius: 8px;
      font-family: var(--sans);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .gold-btn:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 173, 93, 0.4);
    }

    .outline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(10, 31, 23, 0.8);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 10px 18px;
      border-radius: 8px;
      font-family: var(--sans);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition);
    }
    .outline-btn:hover {
      background: rgba(26, 77, 58, 0.85);
      color: #fff;
      transform: translateY(-2px);
    }

    .admin-remove-btn {
      background: none;
      border: 1px solid rgba(255, 100, 100, 0.4);
      color: #ff9999;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: var(--transition);
    }
    .admin-remove-btn:hover {
      background: rgba(255, 60, 60, 0.25);
      color: #fff;
    }

    .admin-result-box {
      background: linear-gradient(135deg, rgba(16, 50, 37, 0.96), rgba(8, 25, 18, 0.96));
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      padding: 1.8rem;
      margin-top: 1.8rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.4s ease;
    }
    .admin-link-display {
      display: flex;
      gap: 10px;
      margin: 12px 0 16px;
    }
    @media (max-width: 600px) {
      .admin-link-display { flex-direction: column; }
    }

    .admin-saved-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }
    .admin-saved-item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(6, 20, 15, 0.8);
      border: 1px solid rgba(212, 173, 93, 0.22);
      border-radius: 8px;
      padding: 14px 16px;
      transition: var(--transition);
    }
    .admin-saved-item:hover {
      border-color: var(--gold-primary);
      background: rgba(10, 30, 22, 0.9);
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(14, 43, 33, 0.96);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
      z-index: 9999;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="admin-wrapper">
    <header class="admin-header">
      <h1 class="admin-brand-title">Dawat Nama by Elitara</h1>
      <div class="admin-brand-sub">✦ Digital Wedding Invitation Studio ✦</div>
      <div class="admin-top-actions">
        <button class="gold-btn" id="loadDemoBtn" type="button" style="padding:8px 18px; font-size:0.84rem;">✨ Load Demo Sample</button>
        <a class="outline-btn" href="/" target="_blank" style="padding:8px 18px; font-size:0.84rem;">🌐 View Client Website</a>
        <button class="outline-btn" id="clearFormBtn" type="button" style="padding:8px 18px; font-size:0.84rem;">🧹 Clear Form</button>
      </div>
    </header>

    <form id="cardGeneratorForm">
      <!-- Couple Details -->
      <div class="admin-section">
        <div class="admin-section-header">👑 1. Bride & Groom Details</div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Groom Full Name (English)</label>
            <input class="admin-input" type="text" id="f_groom" placeholder="e.g. Ahmed Raza" required>
          </div>
          <div>
            <label class="admin-field-label">Groom Name (Urdu)</label>
            <input class="admin-input" type="text" id="f_groomUrdu" placeholder="e.g. احمد رضا" dir="rtl" required>
          </div>
        </div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Bride Full Name (English)</label>
            <input class="admin-input" type="text" id="f_bride" placeholder="e.g. Ayesha Malik" required>
          </div>
          <div>
            <label class="admin-field-label">Bride Name (Urdu)</label>
            <input class="admin-input" type="text" id="f_brideUrdu" placeholder="e.g. عائشہ ملک" dir="rtl" required>
          </div>
        </div>
      </div>

      <!-- Family & Hosts -->
      <div class="admin-section">
        <div class="admin-section-header">🏛️ 2. Family & Hosts</div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Main Host Line (English)</label>
            <input class="admin-input" type="text" id="f_host" placeholder="e.g. Mr. & Mrs. Tariq Mahmood" required>
          </div>
          <div>
            <label class="admin-field-label">Main Host Line (Urdu)</label>
            <input class="admin-input" type="text" id="f_hostUrdu" placeholder="e.g. جناب و محترمہ طارق محمود" dir="rtl" required>
          </div>
        </div>

        <div style="margin-top:1.2rem;">
          <label class="admin-field-label">Welcoming Hosts (Awaiting to Welcome / چشم براہ)</label>
          <div class="admin-hosts-list" id="hostsListContainer"></div>
          <button class="outline-btn" id="addHostBtn" type="button" style="padding:6px 14px; font-size:0.82rem;">+ Add Another Host</button>
        </div>
      </div>

      <!-- Mehndi Ceremony -->
      <div class="admin-section">
        <div class="admin-section-header">🌿 3. Mehndi Ceremony (Rasm-e-Hina)</div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Date & Time</label>
            <input class="admin-input" type="datetime-local" id="f_m_dt" required>
          </div>
          <div>
            <label class="admin-field-label">Display Date (English)</label>
            <input class="admin-input" type="text" id="f_m_date" placeholder="e.g. Thursday, 10th December 2026" required>
          </div>
        </div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Display Date (Urdu)</label>
            <input class="admin-input" type="text" id="f_m_dateUr" placeholder="e.g. بروز جمعرات، ۱۰ دسمبر ۲۰۲۶ء" dir="rtl" required>
          </div>
          <div>
            <label class="admin-field-label">Display Time (English & Urdu)</label>
            <input class="admin-input" type="text" id="f_m_time" placeholder="e.g. 7:00 PM / شام ۷:۰۰ بجے" required>
          </div>
        </div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Venue Name (English)</label>
            <input class="admin-input" type="text" id="f_m_venue" placeholder="e.g. Royal Palm Golf & Country Club, Lahore" required>
          </div>
          <div>
            <label class="admin-field-label">Address (English)</label>
            <input class="admin-input" type="text" id="f_m_addr" placeholder="e.g. 52 Canal Bank Road, Lahore" required>
          </div>
        </div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Google Maps Link</label>
            <input class="admin-input" type="url" id="f_m_map" placeholder="https://maps.google.com/..." required>
          </div>
          <div>
            <label class="admin-field-label">RSVP WhatsApp Number</label>
            <input class="admin-input" type="text" id="f_m_rsvp" placeholder="+923012345678" required>
          </div>
        </div>
      </div>

      <!-- Baraat Ceremony -->
      <div class="admin-section">
        <div class="admin-section-header">🎺 4. Baraat Ceremony</div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Date & Time</label>
            <input class="admin-input" type="datetime-local" id="f_b_dt" required>
          </div>
          <div>
            <label class="admin-field-label">Display Date (English)</label>
            <input class="admin-input" type="text" id="f_b_date" placeholder="e.g. Friday, 11th December 2026" required>
          </div>
        </div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Display Date (Urdu)</label>
            <input class="admin-input" type="text" id="f_b_dateUr" placeholder="e.g. بروز جمعۃ المبارک، ۱۱ دسمبر ۲۰۲۶ء" dir="rtl" required>
          </div>
          <div>
            <label class="admin-field-label">Display Time (English & Urdu)</label>
            <input class="admin-input" type="text" id="f_b_time" placeholder="e.g. Sehra Bandi: 4:30 PM · Departure: 5:30 PM" required>
          </div>
        </div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Venue Name (English)</label>
            <input class="admin-input" type="text" id="f_b_venue" placeholder="e.g. Grand Ballroom, Pearl Continental, Lahore" required>
          </div>
          <div>
            <label class="admin-field-label">Address (English)</label>
            <input class="admin-input" type="text" id="f_b_addr" placeholder="e.g. Shahrah-e-Quaid-e-Azam, Lahore" required>
          </div>
        </div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Google Maps Link</label>
            <input class="admin-input" type="url" id="f_b_map" placeholder="https://maps.google.com/..." required>
          </div>
          <div>
            <label class="admin-field-label">RSVP WhatsApp Number</label>
            <input class="admin-input" type="text" id="f_b_rsvp" placeholder="+923012345678" required>
          </div>
        </div>
      </div>

      <!-- Walima Ceremony -->
      <div class="admin-section">
        <div class="admin-section-header">✨ 5. Walima Reception</div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Date & Time</label>
            <input class="admin-input" type="datetime-local" id="f_w_dt" required>
          </div>
          <div>
            <label class="admin-field-label">Display Date (English)</label>
            <input class="admin-input" type="text" id="f_w_date" placeholder="e.g. Saturday, 12th December 2026" required>
          </div>
        </div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Display Date (Urdu)</label>
            <input class="admin-input" type="text" id="f_w_dateUr" placeholder="e.g. بروز ہفتہ، ۱۲ دسمبر ۲۰۲۶ء" dir="rtl" required>
          </div>
          <div>
            <label class="admin-field-label">Display Time (English & Urdu)</label>
            <input class="admin-input" type="text" id="f_w_time" placeholder="e.g. 7:00 PM / شام ۷:۰۰ بجے" required>
          </div>
        </div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Venue Name (English)</label>
            <input class="admin-input" type="text" id="f_w_venue" placeholder="e.g. Crystal Hall, Nishat Banquets, Emporium Mall, Lahore" required>
          </div>
          <div>
            <label class="admin-field-label">Address (English)</label>
            <input class="admin-input" type="text" id="f_w_addr" placeholder="e.g. Abdul Haque Road, Johar Town, Lahore" required>
          </div>
        </div>
        <div class="admin-grid-2">
          <div>
            <label class="admin-field-label">Google Maps Link</label>
            <input class="admin-input" type="url" id="f_w_map" placeholder="https://maps.google.com/..." required>
          </div>
          <div>
            <label class="admin-field-label">RSVP WhatsApp Number</label>
            <input class="admin-input" type="text" id="f_w_rsvp" placeholder="+923012345678" required>
          </div>
        </div>
      </div>

      <button class="gold-btn" type="submit" style="width:100%; font-size:1.05rem; padding:15px;">
        ✦ Generate & Save Digital Invitation Card ✦
      </button>
    </form>

    <!-- Result Area -->
    <div id="adminResultArea" style="display:none;"></div>

    <!-- Saved Invitations Section -->
    <div class="admin-section" style="margin-top:2.2rem;">
      <div class="admin-section-header">📁 Your Created Invitations</div>
      <div id="savedCardsContainer"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3200);
    }

    function encodeWeddingData(data) {
      try {
        const json = JSON.stringify(data);
        return btoa(encodeURIComponent(json));
      } catch (err) {
        console.error("Encoding error", err);
        return "";
      }
    }

    let currentHosts = [
      { name: "Tariq Mahmood", nameUrdu: "طارق محمود", phone: "+92 301 2345678" },
      { name: "Muhammad Bilal", nameUrdu: "محمد بلال", phone: "+92 302 3456789" },
      { name: "Hamza Tariq", nameUrdu: "حمزہ طارق", phone: "+92 303 4567890" },
      { name: "Zain Ali", nameUrdu: "زین علی", phone: "+92 304 5678901" }
    ];

    function renderHostsInputs() {
      const c = document.getElementById("hostsListContainer");
      if (!c) return;
      c.innerHTML = currentHosts.map((h, i) => `
        <div class="admin-host-row">
          <input class="admin-input" type="text" placeholder="Name (EN)" value="${h.name}" data-host-idx="${i}" data-host-prop="name">
          <input class="admin-input" type="text" placeholder="Name (UR)" value="${h.nameUrdu}" dir="rtl" data-host-idx="${i}" data-host-prop="nameUrdu">
          <input class="admin-input" type="text" placeholder="Phone (+92 301 ...)" value="${h.phone}" data-host-idx="${i}" data-host-prop="phone">
          <button class="admin-remove-btn" type="button" data-del-host="${i}">✕</button>
        </div>
      `).join("");

      c.querySelectorAll("input").forEach(inp => {
        inp.addEventListener("input", (e) => {
          const idx = parseInt(e.target.getAttribute("data-host-idx"));
          const prop = e.target.getAttribute("data-host-prop");
          currentHosts[idx][prop] = e.target.value;
        });
      });

      c.querySelectorAll("[data-del-host]").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.getAttribute("data-del-host"));
          currentHosts.splice(idx, 1);
          renderHostsInputs();
        });
      });
    }

    renderHostsInputs();

    document.getElementById("addHostBtn").addEventListener("click", () => {
      currentHosts.push({ name: "", nameUrdu: "", phone: "+92 " });
      renderHostsInputs();
    });

    function fillSampleData() {
      document.getElementById("f_groom").value = "Ahmed Raza";
      document.getElementById("f_groomUrdu").value = "احمد رضا";
      document.getElementById("f_bride").value = "Ayesha Malik";
      document.getElementById("f_brideUrdu").value = "عائشہ ملک";
      document.getElementById("f_host").value = "Mr. & Mrs. Tariq Mahmood";
      document.getElementById("f_hostUrdu").value = "جناب و محترمہ طارق محمود";

      document.getElementById("f_m_dt").value = "2026-12-10T19:00";
      document.getElementById("f_m_date").value = "Thursday, 10th December 2026";
      document.getElementById("f_m_dateUr").value = "بروز جمعرات، ۱۰ دسمبر ۲۰۲۶ء";
      document.getElementById("f_m_time").value = "7:00 PM";
      document.getElementById("f_m_venue").value = "Royal Palm Golf & Country Club, Lahore";
      document.getElementById("f_m_addr").value = "52 Canal Bank Road, Lahore";
      document.getElementById("f_m_map").value = "https://maps.google.com/?q=Royal+Palm+Golf+and+Country+Club+Lahore";
      document.getElementById("f_m_rsvp").value = "+923012345678";

      document.getElementById("f_b_dt").value = "2026-12-11T16:30";
      document.getElementById("f_b_date").value = "Friday, 11th December 2026";
      document.getElementById("f_b_dateUr").value = "بروز جمعۃ المبارک، ۱۱ دسمبر ۲۰۲۶ء";
      document.getElementById("f_b_time").value = "Sehra Bandi: 4:30 PM · Departure: 5:30 PM";
      document.getElementById("f_b_venue").value = "Grand Ballroom, Pearl Continental, Lahore";
      document.getElementById("f_b_addr").value = "Shahrah-e-Quaid-e-Azam, Lahore";
      document.getElementById("f_b_map").value = "https://maps.google.com/?q=Pearl+Continental+Hotel+Lahore";
      document.getElementById("f_b_rsvp").value = "+923012345678";

      document.getElementById("f_w_dt").value = "2026-12-12T19:00";
      document.getElementById("f_w_date").value = "Saturday, 12th December 2026";
      document.getElementById("f_w_dateUr").value = "بروز ہفتہ، ۱۲ دسمبر ۲۰۲۶ء";
      document.getElementById("f_w_time").value = "7:00 PM";
      document.getElementById("f_w_venue").value = "Crystal Hall, Nishat Banquets, Emporium Mall, Lahore";
      document.getElementById("f_w_addr").value = "Abdul Haque Road, Johar Town, Lahore";
      document.getElementById("f_w_map").value = "https://maps.google.com/?q=Nishat+Banquets+Lahore";
      document.getElementById("f_w_rsvp").value = "+923012345678";

      currentHosts = [
        { name: "Tariq Mahmood", nameUrdu: "طارق محمود", phone: "+92 301 2345678" },
        { name: "Muhammad Bilal", nameUrdu: "محمد بلال", phone: "+92 302 3456789" },
        { name: "Hamza Tariq", nameUrdu: "حمزہ طارق", phone: "+92 303 4567890" },
        { name: "Zain Ali", nameUrdu: "زین علی", phone: "+92 304 5678901" }
      ];
      renderHostsInputs();
      showToast("Demo data loaded!");
    }

    document.getElementById("loadDemoBtn").addEventListener("click", fillSampleData);
    document.getElementById("clearFormBtn").addEventListener("click", () => {
      document.getElementById("cardGeneratorForm").reset();
      currentHosts = [{ name: "", nameUrdu: "", phone: "+92 " }];
      renderHostsInputs();
      showToast("Form cleared!");
    });

    let savedCards = [];
    try {
      savedCards = JSON.parse(localStorage.getItem("edawatnama_saved_cards") || "[]");
    } catch (e) {
      savedCards = [];
    }

    function renderSavedCardsList() {
      const container = document.getElementById("savedCardsContainer");
      if (!savedCards.length) {
        container.innerHTML = `<p style="font-size:0.86rem; color:var(--cream-muted); font-style:italic;">No saved invitations yet. Generate a card above to see it here!</p>`;
        return;
      }
      container.innerHTML = `
        <div class="admin-saved-list">
          ${savedCards.map((c, idx) => {
            const liveUrl = `${window.location.origin}/?invite=${c.encoded}`;
            return `
              <div class="admin-saved-item">
                <div>
                  <strong style="color:var(--gold-light); font-size:1rem;">${c.groom} & ${c.bride}</strong>
                  <div style="font-size:0.76rem; color:var(--cream-muted); margin-top:2px;">${c.createdAt || 'Saved Card'}</div>
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                  <a class="outline-btn" style="padding:6px 12px; font-size:0.78rem;" href="${liveUrl}" target="_blank">Open Card ↗</a>
                  <button class="outline-btn" style="padding:6px 12px; font-size:0.78rem;" type="button" data-copy-link="${liveUrl}">Copy Link 📋</button>
                  <button class="admin-remove-btn" type="button" data-delete-card="${idx}">Delete 🗑️</button>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;

      container.querySelectorAll("[data-copy-link]").forEach(btn => {
        btn.addEventListener("click", () => {
          const link = btn.getAttribute("data-copy-link");
          navigator.clipboard.writeText(link);
          showToast("Invitation link copied to clipboard!");
        });
      });

      container.querySelectorAll("[data-delete-card]").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.getAttribute("data-delete-card"));
          if (confirm("Are you sure you want to delete this saved invitation?")) {
            savedCards.splice(idx, 1);
            try {
              localStorage.setItem("edawatnama_saved_cards", JSON.stringify(savedCards));
            } catch (e) {}
            renderSavedCardsList();
            showToast("Invitation deleted.");
          }
        });
      });
    }

    renderSavedCardsList();

    // Generate Card Form Handler
    document.getElementById("cardGeneratorForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const groom = document.getElementById("f_groom").value.trim();
      const groomUrdu = document.getElementById("f_groomUrdu").value.trim();
      const bride = document.getElementById("f_bride").value.trim();
      const brideUrdu = document.getElementById("f_brideUrdu").value.trim();
      const host = document.getElementById("f_host").value.trim();
      const hostUrdu = document.getElementById("f_hostUrdu").value.trim();

      const cardData = {
        slug: `${groom.replace(/[^a-zA-Z0-9]/g, "-")}-&-${bride.replace(/[^a-zA-Z0-9]/g, "-")}-wedding-invitation`,
        groom,
        groomUrdu,
        bride,
        brideUrdu,
        host,
        hostUrdu,
        welcomeHosts: currentHosts.filter(h => h.name && h.phone),
        events: {
          mehndi: {
            dateTime: document.getElementById("f_m_dt").value + ":00+05:00",
            displayDate: document.getElementById("f_m_date").value.trim(),
            displayDateUrdu: document.getElementById("f_m_dateUr").value.trim(),
            displayTime: document.getElementById("f_m_time").value.trim(),
            displayTimeUrdu: document.getElementById("f_m_time").value.trim(),
            venue: document.getElementById("f_m_venue").value.trim(),
            venueUrdu: document.getElementById("f_m_venue").value.trim(),
            address: document.getElementById("f_m_addr").value.trim(),
            addressUrdu: document.getElementById("f_m_addr").value.trim(),
            mapUrl: document.getElementById("f_m_map").value.trim(),
            rsvpPhone: document.getElementById("f_m_rsvp").value.trim()
          },
          baraat: {
            dateTime: document.getElementById("f_b_dt").value + ":00+05:00",
            displayDate: document.getElementById("f_b_date").value.trim(),
            displayDateUrdu: document.getElementById("f_b_dateUr").value.trim(),
            displayTime: document.getElementById("f_b_time").value.trim(),
            displayTimeUrdu: document.getElementById("f_b_time").value.trim(),
            venue: document.getElementById("f_b_venue").value.trim(),
            venueUrdu: document.getElementById("f_b_venue").value.trim(),
            address: document.getElementById("f_b_addr").value.trim(),
            addressUrdu: document.getElementById("f_b_addr").value.trim(),
            mapUrl: document.getElementById("f_b_map").value.trim(),
            rsvpPhone: document.getElementById("f_b_rsvp").value.trim()
          },
          walima: {
            dateTime: document.getElementById("f_w_dt").value + ":00+05:00",
            displayDate: document.getElementById("f_w_date").value.trim(),
            displayDateUrdu: document.getElementById("f_w_dateUr").value.trim(),
            displayTime: document.getElementById("f_w_time").value.trim(),
            displayTimeUrdu: document.getElementById("f_w_time").value.trim(),
            venue: document.getElementById("f_w_venue").value.trim(),
            venueUrdu: document.getElementById("f_w_venue").value.trim(),
            address: document.getElementById("f_w_addr").value.trim(),
            addressUrdu: document.getElementById("f_w_addr").value.trim(),
            mapUrl: document.getElementById("f_w_map").value.trim(),
            rsvpPhone: document.getElementById("f_w_rsvp").value.trim()
          }
        }
      };

      const encoded = encodeWeddingData(cardData);
      const liveUrl = `${window.location.origin}/?invite=${encoded}`;
      const waShareText = `With the grace of Allah Almighty, you are cordially invited to celebrate the wedding ceremonies of ${groom} & ${bride}.\n\nExplore our royal digital wedding invitation here:\n${liveUrl}`;

      // Save to localStorage
      const newRecord = {
        groom,
        bride,
        encoded,
        createdAt: new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })
      };
      savedCards.unshift(newRecord);
      try {
        localStorage.setItem("edawatnama_saved_cards", JSON.stringify(savedCards));
      } catch (e) {}

      const resultArea = document.getElementById("adminResultArea");
      resultArea.style.display = "block";
      resultArea.innerHTML = `
        <div class="admin-result-box">
          <h3 style="color:var(--gold-light); font-family:var(--serif); margin:0 0 6px;">✦ Digital Invitation Generated Successfully! ✦</h3>
          <p style="font-size:0.86rem; color:var(--cream); margin-bottom:12px;">
            Your royal wedding card is live and ready to send to guests or clients!
          </p>
          <div class="admin-link-display">
            <input class="admin-input" type="text" id="generatedLinkInput" value="${liveUrl}" readonly>
            <button class="gold-btn" id="copyGenLinkBtn" type="button" style="white-space:nowrap;">📋 Copy Link</button>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
            <a class="gold-btn" href="${liveUrl}" target="_blank">👁️ Open Card in New Tab</a>
            <button class="outline-btn" id="copyWaShareBtn" type="button">💬 Copy WhatsApp Message</button>
          </div>
        </div>
      `;

      document.getElementById("copyGenLinkBtn").addEventListener("click", () => {
        navigator.clipboard.writeText(liveUrl);
        showToast("Invitation link copied to clipboard!");
      });

      document.getElementById("copyWaShareBtn").addEventListener("click", () => {
        navigator.clipboard.writeText(waShareText);
        showToast("WhatsApp message copied to clipboard!");
      });

      renderSavedCardsList();
      resultArea.scrollIntoView({ behavior: "smooth" });
    });
  </script>
</body>
</html>
