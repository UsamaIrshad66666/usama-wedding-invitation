<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10251f">
<meta name="description" content="A royal wedding invitation celebrating the union of Syed Usama Irshad and Dr. Bissal Khan.">
<title>Usama & Bissal — Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#10251f;--green2:#19372d;--gold:#c9a45c;--gold2:#ead5a1;--cream:#f7f0e3;--ink:#26332c;--muted:#8e8a7c;--line:rgba(201,164,92,.38);--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",Arial,sans-serif;--urdu:"Noto Nastaliq Urdu",serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--green);color:var(--cream);font-family:var(--sans);min-height:100vh}button{font:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--gold2);outline-offset:4px}.hidden{display:none!important}.page{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 5%,#254438 0,#142d25 38%,#0c1c17 100%)}.ornament{position:absolute;inset:14px;border:1px solid var(--line);pointer-events:none;z-index:1}.ornament:before,.ornament:after{content:"✦";position:absolute;color:var(--gold);font-size:19px;background:var(--green);padding:0 8px}.ornament:before{top:-12px;left:50%;transform:translateX(-50%)}.ornament:after{bottom:-12px;left:50%;transform:translateX(-50%)}.corner{position:absolute;width:75px;height:75px;border-color:var(--gold);opacity:.65;pointer-events:none}.tl{top:23px;left:23px;border-top:1px solid;border-left:1px solid}.tr{top:23px;right:23px;border-top:1px solid;border-right:1px solid}.bl{bottom:23px;left:23px;border-bottom:1px solid;border-left:1px solid}.br{bottom:23px;right:23px;border-bottom:1px solid;border-right:1px solid}
.screen{position:relative;z-index:2;max-width:900px;margin:auto;padding:54px 34px 60px;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center}.eyebrow{letter-spacing:.32em;text-transform:uppercase;font-size:10px;color:var(--gold2)}.monogram{width:88px;height:88px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:32px auto 18px;color:var(--gold2);font:500 36px var(--serif);position:relative}.monogram:before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,164,92,.5);border-radius:50%}.hero-title{font:500 clamp(44px,8vw,76px)/.95 var(--serif);margin:10px 0;color:var(--cream)}.amp{color:var(--gold);font-style:italic}.subline{font:italic 19px var(--serif);color:var(--gold2);margin:14px 0 24px}.hostline{font-size:11px;letter-spacing:.14em;color:#d5c8aa;margin:4px 0}.intro{max-width:490px;color:#d3d1c4;font:17px/1.8 var(--serif);margin:22px auto}.gold-btn{border:1px solid var(--gold);background:linear-gradient(135deg,#dfc17d,#b78d45);color:#17261f;padding:14px 26px;letter-spacing:.14em;text-transform:uppercase;font-size:10px;font-weight:700;cursor:pointer;transition:transform .25s,box-shadow .25s}.gold-btn:hover{transform:translateY(-3px);box-shadow:0 9px 24px #0005}.text-btn{border:0;background:transparent;color:var(--gold2);cursor:pointer;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:12px}.language-row{display:flex;gap:8px;margin:20px 0}.lang-btn{border:1px solid var(--line);background:transparent;color:#d7c9a9;padding:7px 12px;font-size:10px;cursor:pointer}.lang-btn.active{background:#d3b574;color:#17261f}
.envelope-stage{height:190px;width:min(340px,85vw);position:relative;margin:24px auto 18px;perspective:900px;filter:drop-shadow(0 22px 18px #0006)}.envelope{position:absolute;inset:35px 0 0;background:linear-gradient(145deg,#e4d2a7,#b38b4c);clip-path:polygon(0 0,100% 0,100% 100%,0 100%);border-radius:3px}.env-front{position:absolute;inset:0;background:linear-gradient(135deg,#d6bd83,#a97f3d);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}.env-flap{position:absolute;top:35px;left:0;width:100%;height:105px;background:linear-gradient(135deg,#f0dfb5,#bd9652);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s cubic-bezier(.2,.8,.2,1);z-index:3}.seal{position:absolute;z-index:4;left:50%;top:90px;transform:translateX(-50%);width:47px;height:47px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d995,#9d6c2e);border:1px solid #f5e5b8;color:#4b351a;display:grid;place-items:center;font:22px var(--serif);box-shadow:0 3px 8px #0004;transition:opacity .4s}.envelope.open .env-flap{transform:rotateX(180deg)}.envelope.open .seal{opacity:0}.letter{position:absolute;z-index:2;left:7%;width:86%;height:130px;top:38px;background:#f9f0dd;color:#755a32;display:grid;place-items:center;font:italic 24px var(--serif);transition:transform 1s .2s;box-shadow:0 2px 9px #0003}.envelope.open .letter{transform:translateY(-90px)}
.section-title{font:500 clamp(34px,6vw,48px)/1.1 var(--serif);color:var(--cream);margin:14px 0}.section-copy{font:16px/1.8 var(--serif);color:#d0c9b7;max-width:500px}.event-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;width:100%;margin:28px 0}.event-card{position:relative;text-align:left;border:1px solid var(--line);background:linear-gradient(145deg,#1b3b30,#10251f);padding:24px 22px;min-height:180px;cursor:pointer;color:var(--cream);transition:transform .25s,border-color .25s,background .25s}.event-card:hover{transform:translateY(-5px);border-color:var(--gold);background:linear-gradient(145deg,#254a3b,#132c23)}.event-num{color:var(--gold);font:italic 15px var(--serif)}.event-name{font:500 34px var(--serif);margin:14px 0 4px}.event-urdu{font:20px var(--urdu);color:var(--gold2);direction:rtl}.event-date{font-size:10px;letter-spacing:.13em;color:#bcb8a9;margin-top:13px}.arrow{position:absolute;right:20px;bottom:20px;color:var(--gold);font-size:20px}
.detail-wrap{width:100%;max-width:700px;margin:12px auto}.detail-panel{border:1px solid var(--line);padding:clamp(24px,6vw,48px);background:linear-gradient(145deg,#1a382d,#10251f);position:relative}.detail-panel:before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,164,92,.16);pointer-events:none}.detail-urdu{font:27px var(--urdu);color:var(--gold2);direction:rtl;margin:10px}.detail-date{font:italic 22px var(--serif);color:var(--gold2);margin:14px}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:28px auto;max-width:440px}.timebox{border:1px solid var(--line);padding:12px 4px;background:#0b1c16a8}.timebox strong{display:block;font:500 30px var(--serif);color:var(--gold2)}.timebox span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#c5bdab}.count-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:22px}.event-info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0;text-align:left}.info-cell{padding:15px;border-top:1px solid var(--line)}.info-label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}.info-value{font:19px/1.4 var(--serif);color:var(--cream);margin-top:7px;white-space:pre-line}.detail-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}.outline-btn{border:1px solid var(--line);background:transparent;color:var(--gold2);padding:12px 17px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.outline-btn:hover{border-color:var(--gold);background:#ffffff0a}.back{align-self:flex-start;margin:0 0 18px;color:var(--gold2);border:0;background:transparent;cursor:pointer;font-size:11px;letter-spacing:.1em;text-transform:uppercase}.footer{margin-top:auto;padding-top:38px;color:#a9a38f;font:italic 16px var(--serif)}.footer b{color:var(--gold2);font-weight:500}.top-tools{position:relative;z-index:3;display:flex;justify-content:flex-end;gap:8px;width:100%;max-width:850px;margin:0 auto;padding:22px 32px 0}.tool-btn{background:transparent;border:1px solid var(--line);color:var(--gold2);font-size:10px;padding:8px 11px;cursor:pointer}.urdu-mode{font-family:var(--urdu)!important;direction:rtl}.fade-in{animation:fade .7s both}.rise-in{animation:rise .8s .1s both}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@media(max-width:560px){.screen{padding:38px 26px 45px}.event-grid{grid-template-columns:1fr}.event-card{min-height:150px}.event-info{grid-template-columns:1fr}.top-tools{padding:18px 26px 0}.ornament{inset:10px}.corner{width:44px;height:44px}.hero-title{font-size:54px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="page">
<div class="ornament"></div><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
<div class="top-tools"><button class="tool-btn" id="languageToggle" type="button">اردو / English</button><button class="tool-btn" id="musicToggle" type="button" aria-pressed="false">♫ Music: Off</button></div>
<main class="screen" id="app" aria-live="polite"></main>
</div>
<audio id="weddingMusic" loop preload="none" src="assets/wedding-music.mp3"></audio>
<script>
/* EDIT EVENT DETAILS HERE. Use local time in ISO format: YYYY-MM-DDTHH:mm:ss */
const WEDDING = {
  groom: "Syed Usama Irshad",
  bride: "Dr. Bissal Khan",
  host: "Irshad Ali",
  events: {
    mehndi: { date: "", time: "", venue: "", address: "", map: "", rsvp: "" },
    baraat: { date: "", time: "", venue: "", address: "", map: "", rsvp: "" },
    walima: { date: "", time: "", venue: "", address: "", map: "", rsvp: "" }
  }
};
const EVENT_META = {
  mehndi: { en:"Mehndi", ur:"تقریبِ مہندی", number:"01", desc:"An evening of colour, music and joyful traditions." },
  baraat: { en:"Baraat", ur:"تقریبِ بارات", number:"02", desc:"A beautiful beginning as two families come together." },
  walima: { en:"Walima", ur:"دعوتِ ولیمہ", number:"03", desc:"Join us as we celebrate this new chapter with gratitude." }
};
const CARD_EVENTS = {
  "walima":["walima"],
  "mehndi-walima":["mehndi","walima"],
  "all":["mehndi","baraat","walima"]
};
const params = new URLSearchParams(location.search);
const cardType = CARD_EVENTS[params.get("card")] ? params.get("card") : "all";
let currentLang = "en";
let timerHandle = null;
const app = document.getElementById("app");
const $ = (id) => document.getElementById(id);
function dateLabel(event){
  const d = WEDDING.events[event].date;
  if(!d) return currentLang==="ur" ? "تاریخ کا اعلان جلد کیا جائے گا" : "Date to be announced";
  const parsed = new Date(d);
  return isNaN(parsed) ? d : parsed.toLocaleDateString(currentLang==="ur"?"ur-PK":"en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function showEnvelope(){
  clearInterval(timerHandle);
  app.innerHTML = '<div class="eyebrow fade-in">A Royal Wedding Invitation</div><div class="monogram rise-in">UI</div><div class="hostline rise-in">IRSHAD ALI REQUESTS THE PLEASURE OF YOUR COMPANY</div><div class="hero-title rise-in">Usama <span class="amp">&</span><br>Bissal</div><div class="subline rise-in">Together with their families</div><p class="intro rise-in">With hearts full of gratitude, we invite you to share in the joy and blessings of our wedding celebrations.</p><div class="envelope-stage rise-in"><div class="envelope" id="envelope"><div class="letter">With love & duas</div><div class="env-flap"></div><div class="env-front"></div><div class="seal">UI</div></div></div><button class="gold-btn rise-in" id="openInvite">Open Invitation</button><div class="footer">Bismillah-ir-Rahman-ir-Raheem</div>';
  $("openInvite").addEventListener("click",()=>{
    $("envelope").classList.add("open");
    $("openInvite").disabled=true;
    $("openInvite").textContent="Opening…";
    setTimeout(showEvents,950);
  });
}
function showEvents(){
  clearInterval(timerHandle);
  const keys=CARD_EVENTS[cardType];
  const ur=currentLang==="ur";
  app.innerHTML='<div class="eyebrow fade-in">'+(ur?'خوشی کے لمحات':'The Wedding Celebrations')+'</div><div class="monogram">UI</div><h1 class="section-title">'+(ur?'تقریبات':'Select an Occasion')+'</h1><p class="section-copy">'+(ur?'جس تقریب کی تفصیلات دیکھنا چاہیں اسے منتخب کریں۔':'Choose an event to explore its details and countdown.')+'</p><div class="event-grid">'+keys.map((key)=>{const m=EVENT_META[key];return '<button class="event-card rise-in" data-event="'+key+'"><div class="event-num">'+m.number+'</div><div class="event-name">'+m.en+'</div><div class="event-urdu">'+m.ur+'</div><div class="event-date">'+dateLabel(key)+'</div><span class="arrow">↗</span></button>';}).join("")+'</div><div class="footer">Celebrating <b>Usama & Bissal</b></div>';
  app.querySelectorAll("[data-event]").forEach(btn=>btn.addEventListener("click",()=>showDetail(btn.dataset.event)));
}
function showDetail(key){
  clearInterval(timerHandle);
  const m=EVENT_META[key],e=WEDDING.events[key],ur=currentLang==="ur";
  const venue=e.venue|| (ur?"مقام کا اعلان جلد ہوگا":"Venue to be announced");
  const time=e.time|| (ur?"وقت کا اعلان جلد ہوگا":"Time to be announced");
  app.innerHTML='<button class="back" id="backEvents">← '+(ur?'تمام تقریبات':'All Events')+'</button><div class="detail-wrap fade-in"><div class="detail-panel"><div class="eyebrow">'+m.number+' · '+(ur?'تقریب':'Wedding Celebration')+'</div><div class="monogram">UI</div><h1 class="section-title">'+m.en+'</h1><div class="detail-urdu">'+m.ur+'</div><p class="section-copy">'+m.desc+'</p><div class="count-label">'+(ur?'تقریب شروع ہونے میں باقی وقت':'Countdown to the celebration')+'</div><div class="countdown" id="countdown"><div class="timebox"><strong>—</strong><span>Days</span></div><div class="timebox"><strong>—</strong><span>Hours</span></div><div class="timebox"><strong>—</strong><span>Minutes</span></div><div class="timebox"><strong>—</strong><span>Seconds</span></div></div><div class="event-date">'+dateLabel(key)+'</div><div class="event-info"><div class="info-cell"><div class="info-label">'+(ur?'تاریخ':'Date')+'</div><div class="info-value">'+dateLabel(key)+'</div></div><div class="info-cell"><div class="info-label">'+(ur?'وقت':'Time')+'</div><div class="info-value">'+time+'</div></div><div class="info-cell"><div class="info-label">'+(ur?'مقام':'Venue')+'</div><div class="info-value">'+venue+'</div></div><div class="info-cell"><div class="info-label">'+(ur?'پتہ':'Address')+'</div><div class="info-value">'+(e.address||'—')+'</div></div></div><div class="detail-actions">'+(e.map?'<a class="outline-btn" href="'+e.map+'" target="_blank" rel="noopener">Open Map ↗</a>':'')+(e.rsvp?'<a class="gold-btn" href="https://wa.me/'+e.rsvp.replace(/[^0-9]/g,"")+'" target="_blank" rel="noopener">RSVP on WhatsApp</a>':'')+'<button class="outline-btn" id="shareEvent">Share Invitation</button></div></div></div><div class="footer">With warm regards · <b>'+WEDDING.host+'</b></div>';
  $("backEvents").addEventListener("click",showEvents);
  $("shareEvent").addEventListener("click",async()=>{const url=location.href.split("#")[0];try{if(navigator.share)await navigator.share({title:m.en+" — Usama & Bissal",url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);$("shareEvent").textContent="Link copied";}}catch(err){}});
  startCountdown(key);
}
function startCountdown(key){
  const target=WEDDING.events[key].date;
  const box=$("countdown");
  if(!target){box.innerHTML='<p class="section-copy" style="grid-column:1/-1;margin:0 auto">'+(currentLang==="ur"?'تاریخ شامل ہونے پر الٹی گنتی خود شروع ہو جائے گی۔':'The countdown will start automatically once the event date is added.')+'</p>';return;}
  const end=new Date(target).getTime();
  if(!Number.isFinite(end)){box.innerHTML='<p class="section-copy" style="grid-column:1/-1">Add a valid event date in the WEDDING settings.</p>';return;}
  const tick=()=>{const now=Date.now(),diff=end-now;if(diff<=0){box.innerHTML='<p class="section-copy" style="grid-column:1/-1">The celebration day is here!</p>';clearInterval(timerHandle);return;}const vals=[Math.floor(diff/86400000),Math.floor(diff/3600000)%24,Math.floor(diff/60000)%60,Math.floor(diff/1000)%60];const labels=currentLang==="ur"?["دن","گھنٹے","منٹ","سیکنڈ"]:["Days","Hours","Minutes","Seconds"];box.innerHTML=vals.map((v,i)=>'<div class="timebox"><strong>'+String(v).padStart(2,"0")+'</strong><span>'+labels[i]+'</span></div>').join("");};
  tick();timerHandle=setInterval(tick,1000);
}
$("languageToggle").addEventListener("click",()=>{currentLang=currentLang==="en"?"ur":"en";$("languageToggle").textContent=currentLang==="en"?"اردو / English":"English / اردو";if($("countdown")){const key=Object.keys(EVENT_META).find(k=>app.innerHTML.includes('data-event="'+k+'"'));if(key)showEvents();}else if(app.querySelector("#backEvents")){const title=app.querySelector(".section-title")?.textContent;const key=Object.keys(EVENT_META).find(k=>title===EVENT_META[k].en);if(key)showDetail(key);}else if(app.querySelector("#openInvite"))showEnvelope();});
$("musicToggle").addEventListener("click",async()=>{const audio=$("weddingMusic"),btn=$("musicToggle");if(audio.paused){try{await audio.play();btn.textContent="♫ Music: On";btn.setAttribute("aria-pressed","true");}catch(e){btn.textContent="Add music file";}}else{audio.pause();btn.textContent="♫ Music: Off";btn.setAttribute("aria-pressed","false");}});
showEnvelope();
</script>
</body>
</html>
