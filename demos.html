      });
      performPageEntryScroll(false);
    }

    function startCountdown(eventKey) {
      if (activeTimerHandle) clearInterval(activeTimerHandle);
      const conf = WEDDING.events[eventKey];
      const box = document.getElementById("countdownBox");
      const t = I18N[currentLang];

      if (!conf || !conf.dateTime) {
        box.innerHTML = `<div class="countdown-notice">${t.countdownTBD}</div>`;
        return;
      }

      const targetTime = new Date(conf.dateTime).getTime();
      if (isNaN(targetTime)) {
        box.innerHTML = `<div class="countdown-notice">${t.countdownTBD}</div>`;
        return;
      }

      function updateTick() {
        const now = Date.now();
        const diff = targetTime - now;

        if (diff <= 0) {
          box.innerHTML = `<div class="countdown-notice">${t.countdownPassed}</div>`;
          clearInterval(activeTimerHandle);
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        box.innerHTML = `
          <div class="countdown-grid">
            <div class="countdown-box">
              <span class="countdown-num">${String(days).padStart(2, "0")}</span>
              <span class="countdown-unit">${t.days}</span>
            </div>
            <div class="countdown-box">
              <span class="countdown-num">${String(hours).padStart(2, "0")}</span>
              <span class="countdown-unit">${t.hours}</span>
            </div>
            <div class="countdown-box">
              <span class="countdown-num">${String(mins).padStart(2, "0")}</span>
              <span class="countdown-unit">${t.minutes}</span>
            </div>
            <div class="countdown-box">
              <span class="countdown-num">${String(secs).padStart(2, "0")}</span>
              <span class="countdown-unit">${t.seconds}</span>
            </div>
          </div>
        `;
      }

      updateTick();
      activeTimerHandle = setInterval(updateTick, 1000);
    }

    async function handleShareEvent() {
      const { card, event } = getUrlState();
      const p = new URLSearchParams();
      if (card && card !== "all") {
        p.set("card", card);
      }
      if (event) {
        p.set("event", event);
      }
      const qs = p.toString();
      const origin = "https://e-dawatnama.com";
      const basePath = getCleanInvitationPath();
      const shareUrl = qs ? `${origin}${basePath}?${qs}` : `${origin}${basePath}`;
      const t = I18N[currentLang];
      const isBride = (WEDDING && WEDDING.cardSide === "bride");
      const shareTitle = isBride
        ? `${WEDDING.bride} with ${WEDDING.groom} — Wedding Invitation`
        : `${WEDDING.groom} with ${WEDDING.bride} — Wedding Invitation`;
      const shareText = isBride
        ? (currentLang === "ur" ? "ہماری لختِ جگر کی شادی اور رخصتی کے پرمسرت موقع پر آپ کی شرکت اور دعاؤں کے متمنی ہیں۔" : "Join us in celebrating the wedding and Rukhsati of our beloved daughter.")
        : (currentLang === "ur" ? "ہماری شادی کے پرمسرت موقع پر آپ کی شرکت کے متمنی ہیں۔" : "Join us in celebrating our wedding.");

      if (navigator.share) {
        try {
          await navigator.share({
            title: shareTitle,
            text: shareText,
            url: shareUrl
          });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(shareUrl);
          showToast(t.linkCopied);
          return;
        } catch (err) {}
      }

      prompt(currentLang === "ur" ? "لنک کاپی کریں:" : "Copy this invitation link:", shareUrl);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    function routeCurrentState(isPopState = false) {
      WEDDING = resolveCurrentWeddingConfig();
      const pageMode = resolveCurrentPageMode();

      if (pageMode === "demos") {
        applyCurrentTheme("emerald");
        renderDemosPage(isPopState);
        return;
      }
      if (pageMode === "about") {
        applyCurrentTheme("emerald");
        renderAboutPage(isPopState);
        return;
      }

      if (pageMode === "farman" || (WEDDING && normalizeThemeKey(WEDDING.theme) === "farman")) {
        applyCurrentTheme("farman");
        renderShahiFarmanScreen(isPopState);
        return;
      }

      applyCurrentTheme(WEDDING.theme || "emerald");

      const { card, event, view } = getUrlState();
      if (event) {
        renderEventDetailScreen(event, true);
      } else if (view === "events") {
        renderEventListScreen(false);
      } else {
        renderEnvelopeScreen(isPopState);
      }
    }

    window.addEventListener("popstate", () => {
      routeCurrentState(true);
    });

    const langToggleBtn = document.getElementById("langToggleBtn");
    const langLabel = document.getElementById("langLabel");
    const homeNavBtn = document.getElementById("homeNavBtn");

    if (homeNavBtn) {
      homeNavBtn.addEventListener("click", (e) => {
        const pageMode = resolveCurrentPageMode();
        if (pageMode === "demos" || pageMode === "about") {
          e.preventDefault();
          window.location.href = "/";
          return;
        }
        if (pageMode === "farman" || (WEDDING && normalizeThemeKey(WEDDING.theme) === "farman")) {
          // Re-roll to sealed stage within Shahi Farman theme (stays in Shahi Farman)
          const unrolled = document.getElementById("farmanUnrolledStage");
          const sealed = document.getElementById("farmanSealedStage");
          if (unrolled && sealed && unrolled.classList.contains("visible")) {
            unrolled.classList.remove("visible");
            sealed.classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: "smooth" });
            homeNavBtn.style.display = "none";
          } else {
            renderShahiFarmanScreen(true);
          }
          return;
        }
        const { card } = getUrlState();
        updateUrlState(card, null, true, "cover");
        renderEnvelopeScreen(true);
      });
    }

    function setLanguage(lang) {
      currentLang = lang;
      const isUrdu = lang === "ur";
      document.documentElement.lang = isUrdu ? "ur" : "en";
      document.documentElement.dir = isUrdu ? "rtl" : "ltr";
      if (langLabel) langLabel.textContent = I18N[currentLang].langBtn;

      const pageMode = resolveCurrentPageMode();
      if (pageMode === "demos") {
        renderDemosPage(false);
        return;
      }
      if (pageMode === "about") {
        renderAboutPage(false);
        return;
      }

      if (pageMode === "farman" || (WEDDING && normalizeThemeKey(WEDDING.theme) === "farman")) {
        const unrolled = document.getElementById("farmanUnrolledStage");
        const wasUnrolled = unrolled && unrolled.classList.contains("visible");
        renderShahiFarmanScreen(false);
        if (wasUnrolled) {
          const s = document.getElementById("farmanSealedStage");
          const u = document.getElementById("farmanUnrolledStage");
          if (s) s.classList.add("hidden");
          if (u) u.classList.add("visible");
          if (homeNavBtn) homeNavBtn.style.display = "inline-flex";
        }
        return;
      }

      const { event, view } = getUrlState();
      if (event) {
        renderEventDetailScreen(event, false);
      } else if (view === "events" || !document.getElementById("envelopeElement")) {
        renderEventListScreen(false);
      } else {
        renderEnvelopeScreen(false);
      }
    }

    if (langToggleBtn) {
      langToggleBtn.addEventListener("click", () => {
        const nextLang = currentLang === "en" ? "ur" : "en";
        setLanguage(nextLang);
      });
    }

    // Intercept client-side link navigation for smooth SPA feel
    document.addEventListener("click", (e) => {
      const link = e.target.closest("a[href^='/']");
      if (link && !link.target && !link.hasAttribute("download") && !link.hasAttribute("data-brand-goto-front")) {
        const href = link.getAttribute("href");
        const hLow = href.toLowerCase();
        if (
          href.startsWith("/#") ||
          href.includes("mailto:") ||
          href.includes("tel:") ||
          hLow.includes("royal-grace") || hLow.includes("grace") || hLow.includes("burgundy") ||
          hLow.includes("farman") ||
          hLow.includes("shahi") ||
          hLow.includes("admin") ||
          hLow.includes("order") ||
          hLow.includes("form")
        ) return;
        e.preventDefault();
        try {
          if (window.location.protocol !== "file:") {
            window.history.pushState(null, "", href);
          } else {
            const dummy = new URL(href, "https://e-dawatnama.com");
            window.history.pushState(null, "", dummy.search ? "?" + dummy.searchParams.toString() : "");
          }
        } catch (err) {}
        routeCurrentState(false);
      }
    });

    function initAppHistoryAndRoute() {
      WEDDING = resolveCurrentWeddingConfig();
      const pageMode = resolveCurrentPageMode();

      if (pageMode === "demos") {
        applyCurrentTheme("emerald");
        renderDemosPage(false);
        return;
      }
      if (pageMode === "about") {
        applyCurrentTheme("emerald");
        renderAboutPage(false);
        return;
      }

      if (pageMode === "farman" || (WEDDING && normalizeThemeKey(WEDDING.theme) === "farman")) {
        applyCurrentTheme("farman");
        renderShahiFarmanScreen(false);
        return;
      }

      applyCurrentTheme(WEDDING.theme || "emerald");

      const { card, event, view } = getUrlState();
      if (event) {
        // Synthesize an "events" history entry behind this detail view
        // so pressing phone BACK immediately goes to All Ceremonies!
        const pEvents = new URLSearchParams();
        if (card && card !== "all") pEvents.set("card", card);
        pEvents.set("view", "events");
        const listUrl = `${getCleanInvitationPath()}?${pEvents.toString()}`;
        window.history.replaceState({ card, event: null, view: "events" }, "", listUrl);

        const pDetail = new URLSearchParams();
        if (card && card !== "all") pDetail.set("card", card);
        pDetail.set("event", event);
        const detailUrl = `${getCleanInvitationPath()}?${pDetail.toString()}`;
        window.history.pushState({ card, event, view: "detail" }, "", detailUrl);

        renderEventDetailScreen(event, false);
      } else if (view === "events") {
        updateUrlState(card, null, false, "events");
        renderEventListScreen(false);
      } else {
        updateUrlState(card, null, false, "cover");
        renderEnvelopeScreen(false);
      }
    }

    initAppHistoryAndRoute();
  </script>
</body>
</html>
